/* Helper : timestamp relatif (ex: "il y a 2 h") — V2 */
function timeAgo(ts){
  if(!ts) return "à l'instant";
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return "à l'instant";
  const m=Math.floor(s/60); if(m<60) return "il y a "+m+" min";
  const h=Math.floor(m/60); if(h<24) return "il y a "+h+" h";
  const d=Math.floor(h/24); if(d<30) return "il y a "+d+" j";
  const mo=Math.floor(d/30); if(mo<12) return "il y a "+mo+" mois";
  return "il y a "+Math.floor(mo/12)+" an(s)";
}

/* ---- Helpers couleur (HEX ↔ HSL) pour picker bois ---- */
function hexToHsl(hex){
  hex=(hex||"").replace("#","");
  if(hex.length===3)hex=hex.split("").map(c=>c+c).join("");
  if(hex.length!==6)return{h:28,s:45,l:18};
  const r=parseInt(hex.slice(0,2),16)/255,g=parseInt(hex.slice(2,4),16)/255,b=parseInt(hex.slice(4,6),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h=0,s=0,l=(max+min)/2;
  if(max!==min){
    const d=max-min;
    s=l>.5?d/(2-max-min):d/(max+min);
    switch(max){
      case r:h=(g-b)/d+(g<b?6:0);break;
      case g:h=(b-r)/d+2;break;
      case b:h=(r-g)/d+4;break;
    }
    h/=6;
  }
  return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};
}
function hslToHex(h,s,l){
  s/=100;l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>{const c=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return Math.round(c*255).toString(16).padStart(2,"0");};
  return"#"+f(0)+f(8)+f(4);
}
/* Génère une palette 7-tokens à partir d'une couleur de base (le --bg).
   Les autres tokens sont dérivés en montant progressivement en luminosité,
   sauf --ink/--inkmut qui sont en clair (texte).
   Reproduit exactement la logique V1 : #141519 → #1c1e25 → #242731, etc. */
function paletteFromBase(hex){
  const {h,s,l}=hexToHsl(hex);
  return{
    bg:      hslToHex(h,s,l),                            // Base
    bgsoft:  hslToHex(h,Math.max(s-2,0),Math.max(l-2,2)),// Un peu plus sombre
    panel:   hslToHex(h,s,l+4),                          // Cartes
    panel2:  hslToHex(h,s,l+7),                          // Cartes surélevées
    line:    "rgba(255,255,255,.07)",                    // Ligne discrète universelle
    ink:     "#e9e7e1",                                  // Texte : crème neutre universel
    inkmut:  hslToHex(h,Math.max(s-3,0),Math.min(l+50,65)) // Texte atténué
  };
}

function saveTheme(){try{localStorage.setItem("atelier.theme",JSON.stringify(themeState))}catch(e){}}
function applyTheme(){
  // Palette de fond : preset OU custom (dérivée d'une couleur de base)
  let bg;
  if(themeState.bg==="custom"&&themeState.bgCustomBase){
    bg=paletteFromBase(themeState.bgCustomBase);
  } else {
    bg=BG_PRESETS[themeState.bg]||BG_PRESETS.v1;
  }
  const r=document.documentElement.style;
  r.setProperty("--bg",bg.bg);r.setProperty("--bgsoft",bg.bgsoft);r.setProperty("--panel",bg.panel);
  r.setProperty("--panel2",bg.panel2);r.setProperty("--line",bg.line);r.setProperty("--ink",bg.ink);r.setProperty("--inkmut",bg.inkmut);
  r.setProperty("--acc",themeState.accent);r.setProperty("--acc2",themeState.accent2);
  r.setProperty("--radius",themeState.radius);r.setProperty("--contentw",themeState.contentw);
  const f=FONTS.find(x=>x.id===themeState.font)||FONTS[0];
  r.setProperty("--fontd",f.d);r.setProperty("--fontw",f.w);r.setProperty("--fontu",f.u);
  // --- Couleur du bois ---
  const wc=themeState.wood||"#5a3a20";
  r.setProperty("--wood",wc);
  const hsl=hexToHsl(wc);
  // Version claire (haut du dégradé) et sombre (bas)
  r.setProperty("--wood-light",hslToHex(hsl.h,hsl.s,Math.min(hsl.l+8,55)));
  r.setProperty("--wood-dark",hslToHex(hsl.h,hsl.s,Math.max(hsl.l-14,3)));
  // --- Tapisserie (fond image type Hearthstone) ---
  applyTapestry();
  document.body.classList.toggle("no-glow",!themeState.glow);
  document.body.classList.toggle("no-grain",!themeState.grain);
  saveTheme();
}
/* Applique la tapisserie active : la bleue est embarquée (data URL), les autres
   sont chargées depuis des fichiers .jpg à côté du HTML (si présents). */
function applyTapestry(){
  const id=themeState.tapestry||"blue";
  const b=document.body;
  // Mode "aucun fond" : on masque la tapisserie, fond sombre uni comme la V1
  if(id==="none"){
    b.classList.add("tap-none");
    b.style.removeProperty("--tapestry");
    return;
  }
  b.classList.remove("tap-none");
  // Mode "image locale" : on lit le dataURL stocké dans localStorage
  if(id==="custom"){
    const custom=themeState.customTapestry||localStorage.getItem("atelier.customTapestry");
    if(custom){
      b.style.setProperty("--tapestry",'url("'+custom+'")');
      return;
    }
    // Fallback si aucune image chargée → repasse en bleu
    themeState.tapestry="blue";
  }
  // Presets standards
  const p=TAPESTRY_PRESETS.find(x=>x.id===(themeState.tapestry||"blue"))||TAPESTRY_PRESETS[0];
  const url = p.id==="blue" ? TAPESTRY_BLUE_DATAURL : p.file;
  b.style.setProperty("--tapestry",'url("'+url+'")');
}

/* ============ SÉCURITÉ (V2 : sanitize + esc anti-XSS) ============ */
function sanitize(html){
  if(!html)return"";
  const d=document.createElement("div");
  d.innerHTML=String(html);
  const all=d.querySelectorAll("*");
  for(let i=0;i<all.length;i++){
    const el=all[i],tag=el.tagName.toLowerCase();
    if(["script","iframe","object","embed","link","meta","base"].includes(tag)){el.remove();i--;continue;}
    for(let j=el.attributes.length-1;j>=0;j--){
      const n=el.attributes[j].name.toLowerCase(),v=el.attributes[j].value;
      if(n.indexOf("on")===0||((n==="href"||n==="src"||n==="xlink:href")&&/^\s*(javascript|vbscript|data:text\/html)/i.test(v)))
        el.removeAttribute(el.attributes[j].name);
    }
  }
  return d.innerHTML;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function debounce(fn,ms){let t;return function(){clearTimeout(t);const a=arguments,x=this;t=setTimeout(()=>fn.apply(x,a),ms||220);};}
